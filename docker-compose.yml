name: ecoactivist

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: ecoactivist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: EcoActivistDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EcoActivistDb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
